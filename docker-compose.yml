# One command local stack: Postgres + the app (API serving the built UI).
#   docker compose up --build        → http://localhost:4000
#   docker compose run --rm app npm run db:reset -w server   (re-seed demo data)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safar
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/safar
      JWT_SECRET: local-docker-demo-secret-not-for-prod
      CORS_ORIGIN: http://localhost:4000
      SEED_ON_EMPTY: "true"
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
